# Larger GSAP preset with MLP ratio 5.
# Reference: Spikingformer 8-768, 8 GPUs x 36 images, peak LR 5e-4.
model: spiking_gsap_large
dataset: imagenet
data_dir: ./data/imagenet
num_classes: 1000
img_size: 224
patch_size: 16
dim: 768
depths: 8
time_step: 4
num_heads: 8  # Compatibility only; GSAP does not use attention heads.
mlp_ratio: 5.0  # Hidden width 3840; modest capacity increase at fixed depth/width.
backend: cupy
drop: 0.0
drop_path: 0.0  # Baseline/CIFAR instantiate DropPath but do not apply it.

# Keep the public Spikingformer augmentation recipe for the first comparison.
mean: [0.485, 0.456, 0.406]
std: [0.229, 0.224, 0.225]
crop_pct: 1.0
scale: [1.0, 1.0]
ratio: [1.0, 1.0]
interpolation: bicubic
train_interpolation: bicubic
aa: rand-m9-mstd0.5-inc1
mixup: 0.8
mixup_off_epoch: 0
mixup_prob: 1.0
mixup_mode: batch
mixup_switch_prob: 0.5
cutmix: 1.0
reprob: 0.25
remode: const
smoothing: 0.1

batch_size: 24  # Per GPU, matching the local baseline's memory starting point.
val_batch_size: 24
lr: 5.0e-4
lr_base_size: 288  # Actual peak LR = lr * (batch_size * world_size) / 288.
min_lr: 1.0e-5
warmup_lr: 1.0e-6
opt: adamw
opt_eps: 1.0e-8
opt_betas: [0.9, 0.999]
weight_decay: 0.05
sched: cosine
epochs: 300
warmup_epochs: 20
cooldown_epochs: 10  # timm 0.6.12 runs 300 scheduled + 10 cooldown epochs.
amp: true
workers: 8
pin_mem: true
seed: 42
output: ./runs/imagenet_gsap_large
